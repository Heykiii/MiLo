'use strict';
/* =========================================================
   LITTLE DELIVERY ROBOT: THE LAST MESSAGE
   Core: screen, utils, save, audio, input
   ========================================================= */
const W = 450;
let H = 800;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const MAIN_CTX = ctx;
let VS = 1, VX = 0, VY = 0, DPR = 1;
const CAM = { hz: 0.34, z0: 3, k: 360, camH: 2.93 };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const sw = window.innerWidth, sh = window.innerHeight;
  H = Math.max(660, Math.min(1000, W * sh / sw));
  VS = Math.min(sw / W, sh / H);
  const cw = W * VS, ch = H * VS;
  VX = (sw - cw) / 2; VY = (sh - ch) / 2;
  cv.style.left = VX + 'px'; cv.style.top = VY + 'px';
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  CAM.camH = (0.78 * H - CAM.hz * H) * CAM.z0 / CAM.k;
  if (typeof onResize === 'function') onResize();
}
window.addEventListener('resize', resize);

/* ---------- utils ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(i, j) {
  let h = (i * 374761393 + j * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

const _hexCache = {};
function rgb(hex) {
  if (_hexCache[hex]) return _hexCache[hex];
  const h = hex.replace('#', '');
  const v = [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  _hexCache[hex] = v; return v;
}
function mix(a, b, t, alpha) {
  const A = rgb(a), B = rgb(b);
  const r = Math.round(A[0] + (B[0] - A[0]) * t), g = Math.round(A[1] + (B[1] - A[1]) * t), bl = Math.round(A[2] + (B[2] - A[2]) * t);
  return alpha === undefined ? `rgb(${r},${g},${bl})` : `rgba(${r},${g},${bl},${alpha})`;
}
function rgba(hex, a) { const c = rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function rrect(x, y, w, h, r) {
  if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

/* glow sprites (cached radial gradients) */
const _glow = {};
function glowSprite(hex) {
  if (_glow[hex]) return _glow[hex];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, rgba(hex, 1)); gr.addColorStop(0.25, rgba(hex, 0.55));
  gr.addColorStop(0.6, rgba(hex, 0.15)); gr.addColorStop(1, rgba(hex, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  _glow[hex] = c; return c;
}
function glow(x, y, r, hex, a) {
  if (r < 0.5) return;
  ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.drawImage(glowSprite(hex), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

function wrapText(text, maxW) {
  const words = String(text).split(' '); const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
const FONT = '"Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif';
/* Sunset-neon palette used by the whole UI */
const UI = { pink: '#ff2e88', hot: '#ff5c8a', orange: '#ffa23a', gold: '#ffd166', teal: '#22e4d4', purple: '#2a0f4a', ink: '#12061f', cream: '#fff4e6' };
function font(px, weight) { ctx.font = `${weight || ''} ${px}px ${FONT}`; }
function text(str, x, y, px, col, align, weight) {
  font(px, weight); ctx.fillStyle = col || '#f4ecdc';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
/* big slanted mission-style heading: gradient fill, thick dark outline */
function heading(str, x, y, px, opts) {
  opts = opts || {};
  ctx.save();
  ctx.font = `italic 900 ${px}px ${FONT}`;
  const maxW = opts.maxW || W - 30, mw = ctx.measureText(str).width;
  if (mw > maxW) { px = px * maxW / mw; ctx.font = `italic 900 ${px}px ${FONT}`; }
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(0, y - px / 2, 0, y + px / 2);
  const c = opts.colors || [UI.gold, UI.orange, UI.pink];
  c.forEach((col, i) => g.addColorStop(i / (c.length - 1), col));
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, px * 0.16); ctx.strokeStyle = opts.stroke || UI.ink;
  ctx.strokeText(str, x + px * 0.05, y + px * 0.06);
  ctx.strokeText(str, x, y);
  ctx.fillStyle = g; ctx.fillText(str, x, y);
  ctx.restore();
}
function textBlock(str, x, y, maxW, px, col, align, lh, weight) {
  font(px, weight); ctx.fillStyle = col || '#f4ecdc';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const lines = wrapText(str, maxW); const L = lh || px * 1.32;
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * L));

/* ---------- save ---------- */
const SAVE_KEY = 'milo_last_message_v1';
function defSave() {
  return {
    unlocked: 1, lv: {}, bolts: 0,
    up: { bat: 0, mag: 0, ant: 0, strap: 0 },
    stamps: {}, notes: [], sound: true, music: true, flash: true, hushToggle: false, runner: 'duo',
    choiceKeep: 0, ending: false, chapterSeen: {}
  };
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s) { const d = defSave(); Object.assign(d, s); d.up = Object.assign(defSave().up, s.up || {}); return d; }
  } catch (e) { }
  return defSave();
}
let S = loadSave();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function addNote(id) { if (id && S.notes.indexOf(id) < 0) { S.notes.push(id); save(); } }

/* ---------- audio (all synthesized, no files) ---------- */
let AC = null, master = null, rainGain = null, noiseBuf = null, humGain = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = S.sound ? 0.7 : 0; master.connect(AC.destination);
    const len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.4;
    rainGain = AC.createGain(); rainGain.gain.value = 0;
    src.connect(f); f.connect(rainGain); rainGain.connect(master); src.start();
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 55;
    humGain = AC.createGain(); humGain.gain.value = 0; o.connect(humGain); humGain.connect(master); o.start();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, when, slide) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noiseBurst(dur, vol, freq, when) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime + (when || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1000;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);

const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319];
let boltNote = 0;
const SFX = {
  chirp() { tone(988, 0.07, 'square', 0.04); tone(1480, 0.09, 'square', 0.04, 0.08); },
  curious() { tone(700, 0.18, 'square', 0.04, 0, 1.6); },
  sad() { tone(700, 0.35, 'square', 0.035, 0, 0.6); },
  lane() { tone(520, 0.035, 'sine', 0.05); },
  jump() { tone(380, 0.2, 'triangle', 0.12, 0, 2.1); },
  land() { noiseBurst(0.06, 0.08, 600); },
  bolt() { tone(SCALE[boltNote++ % 8] * 2, 0.09, 'sine', 0.06); },
  frag() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.35, 'sine', 0.09, i * 0.06)); },
  card() { tone(1319, 0.12, 'triangle', 0.08); tone(1760, 0.2, 'triangle', 0.06, 0.1); },
  hit() { tone(1300, 0.16, 'square', 0.05, 0, 0.35); noiseBurst(0.18, 0.25, 900); },
  splash() { noiseBurst(0.22, 0.12, 2500); },
  reboot() { [523, 659, 784].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, 0.2 + i * 0.16)); },
  ui() { tone(1046, 0.05, 'sine', 0.06); },
  good() { [659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'sine', 0.1, i * 0.08)); },
  bad() { tone(330, 0.25, 'sawtooth', 0.04, 0, 0.7); },
  alarm() { tone(880, 0.15, 'square', 0.05); tone(660, 0.2, 'square', 0.05, 0.16); },
  thunder() { noiseBurst(1.8, 0.45, 260); },
  zap() { noiseBurst(0.25, 0.3, 3000); tone(150, 0.25, 'sawtooth', 0.05); },
  stamp() { noiseBurst(0.08, 0.3, 500); tone(784, 0.3, 'sine', 0.08, 0.05); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.4, 'triangle', 0.08, i * 0.09)); },
  push() { tone(140, 0.12, 'sawtooth', 0.03); },
  pulse() { tone(1760, 0.05, 'sine', 0.025); },
  pulseShot() { tone(520, 0.16, 'sawtooth', 0.05, 0, 2.6); tone(1560, 0.1, 'sine', 0.05, 0.03); },
  smash() { noiseBurst(0.3, 0.35, 1800); tone(220, 0.2, 'square', 0.05, 0, 0.5); tone(1320, 0.12, 'triangle', 0.06, 0.08); },
  pop() { tone(900, 0.2, 'sine', 0.08, 0, 0.4); noiseBurst(0.1, 0.2, 3000); },

/* Mira's tune: eight notes, the game's main theme */
const TUNE = [659, 784, 880, 784, 659, 587, 659, 523];
function playTune(step, vol, octave) {
  step = step || 0.38; vol = vol || 0.07; octave = octave || 1;
  TUNE.forEach((f, i) => {
    tone(f * octave, 0.9, 'sine', vol, i * step);
    tone(f * octave * 2, 0.35, 'triangle', vol * 0.25, i * step);
  });
}
function setRain(v) { if (rainGain && AC) rainGain.gain.setTargetAtTime(S.sound ? v * 0.09 : 0, AC.currentTime, 0.6); }
function setHum(v) { if (humGain && AC) humGain.gain.setTargetAtTime(S.sound ? v * 0.05 : 0, AC.currentTime, 0.4); }
function setSound(on) { S.sound = on; save(); if (master) master.gain.value = on ? 0.7 : 0; }

/* ---------- input: tap, swipe, hold, drag ---------- */
let scene = null;
let ptr = null;
function toL(e) { return { x: (e.clientX - VX) / VS, y: (e.clientY - VY) / VS }; }
window.addEventListener('pointerdown', e => {
  audioInit();
  const p = toL(e);
  ptr = { id: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, lx: p.x, ly: p.y, t: performance.now(), held: false, swiped: false, moved: 0 };
  if (scene && scene.onDown) scene.onDown(p.x, p.y);
});
window.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const p = toL(e);
  const dx = p.x - ptr.sx, dy = p.y - ptr.sy;
  ptr.moved = Math.max(ptr.moved, Math.hypot(dx, dy));
  if (scene && scene.dragScroll) {
    if (ptr.moved > 10) ptr.swiped = true;
    if (scene.onDrag) scene.onDrag(p.x - ptr.lx, p.y - ptr.ly);
  } else if (!ptr.swiped && !ptr.held && ptr.moved > 24) {
    ptr.swiped = true;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy < 0 ? 'up' : 'down');
    if (scene && scene.onSwipe) scene.onSwipe(dir);
  }
  ptr.x = p.x; ptr.y = p.y; ptr.lx = p.x; ptr.ly = p.y;
});
function endPtr(e) {
  if (!ptr || e.pointerId !== ptr.id) return;
  const P = ptr; ptr = null;
  if (P.held) { if (scene && scene.onHold) scene.onHold(false, P.x, P.y); }
  else if (!P.swiped) { if (scene && scene.onTap) scene.onTap(P.sx, P.sy); }
  if (scene && scene.onUp) scene.onUp();
}
window.addEventListener('pointerup', endPtr);
window.addEventListener('pointercancel', endPtr);
function inputTick() {
  if (ptr && !ptr.held && !ptr.swiped && scene && scene.onHold && performance.now() - ptr.t > 230 && ptr.moved < 14) {
    ptr.held = true; scene.onHold(true, ptr.x, ptr.y);
  }
}
/* keyboard (for desktop testing) */
const keyHold = {};
window.addEventListener('keydown', e => {
  audioInit();
  if (!scene) return;
  if (e.key === 'ArrowLeft' && scene.onSwipe) scene.onSwipe('left');
  else if (e.key === 'ArrowRight' && scene.onSwipe) scene.onSwipe('right');
  else if (e.key === 'ArrowUp' && scene.onSwipe) scene.onSwipe('up');
  else if (e.key === 'ArrowDown' && scene.onSwipe) scene.onSwipe('down');
  else if (e.key === ' ' && scene.onTap) scene.onTap(W / 2, H * 0.5);
  else if ((e.key === 'h' || e.key === 'Shift') && !keyHold.h && scene.onHold) { keyHold.h = true; scene.onHold(true, W / 2, H / 2); }

});

  if ((e.key === 'h' || e.key === 'Shift') && keyHold.h) { keyHold.h = false; if (scene && scene.onHold) scene.onHold(false); }

/* Android back button calls this; returns true if handled */

  return false;

/* ---------- buttons ---------- */
function slant(x, y, w, h, k) {
  k = k === undefined ? 10 : k;
  ctx.beginPath(); ctx.moveTo(x + k, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w - k, y + h); ctx.lineTo(x, y + h); ctx.closePath();
}
function button(b, label, opts) {
  opts = opts || {};

  ctx.save();
  slant(b.x, b.y, b.w, b.h, Math.min(14, b.h * 0.25));
  if (hot) {
    const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
    g.addColorStop(0, UI.pink); g.addColorStop(1, UI.orange);
    ctx.fillStyle = opts.fill || g;
  } else ctx.fillStyle = opts.fill || 'rgba(18,6,31,0.82)';

  ctx.stroke();
  ctx.restore();
  const px = opts.px || 18;
  ctx.save();
  ctx.font = `italic 800 ${px}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (hot) { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(18,6,31,0.6)'; ctx.strokeText(label.toUpperCase(), b.x + b.w / 2, b.y + b.h / 2 + 1); }
  ctx.fillStyle = opts.col || UI.cream; ctx.fillText(label.toUpperCase(), b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.restore();
}
const inside = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function panel(x, y, w, h, a) {

  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,46,136,0.55)'; ctx.stroke();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, UI.pink); g.addColorStop(1, UI.orange);

/* =========================================================
   DRAWING: Milo (front + back), characters, icons
   Milo model sheet: cream shell #EDE3D2, teal #1F8C86,
   glow cyan #35E0F0, visor #0B0F14, joints #2A2A2E

const MC = { shell: '#EDE3D2', shellD: '#c9bca6', teal: '#1F8C86', tealD: '#166a65', cyan: '#35E0F0', visor: '#0B0F14', joint: '#2A2A2E', amber: '#ffb040', deep: '#3a7bff' };

function eyeColor(o) { return o.eyeCol || (o.expr === 'remember' ? MC.deep : MC.cyan); }

/* front view: x = center, gy = ground y, s = total height in px */
function drawMiloFront(x, gy, s, o) {
  o = o || {};
  const u = s, t = o.t || 0, expr = o.expr || 'happy';
  const bob = (o.walk ? Math.abs(Math.sin(t * 9)) * 0.025 : Math.sin(t * 2) * 0.006) * u;
  const lit = o.dim ? 0.3 : 1;
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, gy, u * 0.3, u * 0.05, 0, 0, TAU); ctx.fill();
  if (o.reflect) glow(x, gy + u * 0.06, u * 0.5, MC.cyan, 0.18 * lit);
  // shoes
  const step = o.walk ? Math.sin(t * 9) * 0.02 * u : 0;
  for (const sd of [-1, 1]) {
    const sx = x + sd * 0.13 * u, sy = gy - 0.055 * u - (sd > 0 ? Math.max(0, step) : Math.max(0, -step));
    // legs
    ctx.fillStyle = MC.joint; rrect(sx - 0.035 * u, gy - 0.2 * u, 0.07 * u, 0.13 * u, 0.02 * u); ctx.fill();
    ctx.fillStyle = MC.shell; ctx.beginPath(); ctx.ellipse(sx, sy, 0.11 * u, 0.06 * u, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = MC.teal; ctx.beginPath(); ctx.ellipse(sx, sy + 0.012 * u, 0.11 * u, 0.045 * u, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = MC.teal; ctx.beginPath(); ctx.ellipse(sx, sy - 0.01 * u, 0.06 * u, 0.03 * u, 0, Math.PI, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.006 * u; ctx.beginPath(); ctx.ellipse(sx, sy, 0.11 * u, 0.06 * u, 0, 0, TAU); ctx.stroke();
  }
  const by = gy - bob;
  // backpack (behind body)
  ctx.fillStyle = MC.teal; rrect(x - 0.25 * u, by - 0.53 * u, 0.5 * u, 0.33 * u, 0.06 * u); ctx.fill();
  ctx.fillStyle = MC.shellD; rrect(x - 0.25 * u, by - 0.53 * u, 0.06 * u, 0.06 * u, 0.02 * u); ctx.fill();
  rrect(x + 0.19 * u, by - 0.53 * u, 0.06 * u, 0.06 * u, 0.02 * u); ctx.fill();
  const packCol = o.pack === 'amber' ? MC.amber : o.pack === 'off' ? '#333' : MC.cyan;
  ctx.fillStyle = packCol; rrect(x - 0.245 * u, by - 0.4 * u, 0.02 * u, 0.06 * u, 0.01 * u); ctx.fill();
  if (o.pack !== 'off') glow(x - 0.235 * u, by - 0.37 * u, 0.05 * u, packCol, 0.8 * lit);
  // body (egg)
  const bg = ctx.createLinearGradient(x - 0.2 * u, by - 0.48 * u, x + 0.2 * u, by - 0.15 * u);
  bg.addColorStop(0, '#f8f1e4'); bg.addColorStop(1, MC.shellD);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(x, by - 0.32 * u, 0.19 * u, 0.165 * u, 0, 0, TAU); ctx.fill();
  // teal swoosh
  ctx.strokeStyle = MC.teal; ctx.lineWidth = 0.035 * u; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x + 0.04 * u, by - 0.3 * u, 0.15 * u, Math.PI * 0.55, Math.PI * 1.05); ctx.stroke();
  // chest panel + battery light bar
  ctx.fillStyle = MC.teal; rrect(x - 0.075 * u, by - 0.42 * u, 0.15 * u, 0.065 * u, 0.02 * u); ctx.fill();
  const maxB = o.maxBat || 3, bat = o.bat === undefined ? maxB : o.bat;
  for (let i = 0; i < maxB; i++) {
    const w = 0.12 * u / maxB;
    ctx.fillStyle = i < bat ? MC.cyan : '#0d3b3a';
    rrect(x - 0.06 * u + i * w + 0.004 * u, by - 0.4 * u, w - 0.008 * u, 0.025 * u, 0.006 * u); ctx.fill();
  }
  if (bat > 0) glow(x, by - 0.39 * u, 0.09 * u, MC.cyan, 0.45 * lit);
  // scratches
  ctx.strokeStyle = 'rgba(120,100,80,0.35)'; ctx.lineWidth = 0.004 * u;
  ctx.beginPath(); ctx.moveTo(x + 0.08 * u, by - 0.26 * u); ctx.lineTo(x + 0.12 * u, by - 0.24 * u); ctx.stroke();
  // arms
  const wave = o.wave ? Math.sin(t * 10) * 0.5 : 0;
  for (const sd of [-1, 1]) {
    ctx.save();
    ctx.translate(x + sd * 0.19 * u, by - 0.42 * u);
    ctx.rotate(sd * (0.38 + (sd > 0 ? wave : 0)) + (o.armsIn ? -sd * 0.2 : 0));
    ctx.fillStyle = MC.joint; ctx.beginPath(); ctx.arc(0, 0, 0.04 * u, 0, TAU); ctx.fill();
    rrect(-0.025 * u, 0, 0.05 * u, 0.07 * u, 0.02 * u); ctx.fill();
    ctx.fillStyle = MC.shell; rrect(-0.045 * u, 0.05 * u, 0.09 * u, 0.1 * u, 0.035 * u); ctx.fill();
    ctx.fillStyle = MC.teal; rrect(-0.045 * u, 0.05 * u, 0.09 * u, 0.018 * u, 0.008 * u); ctx.fill();
    ctx.fillStyle = MC.joint; ctx.beginPath(); ctx.arc(0, 0.175 * u, 0.033 * u, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // neck
  ctx.fillStyle = MC.joint; rrect(x - 0.06 * u, by - 0.53 * u, 0.12 * u, 0.07 * u, 0.02 * u); ctx.fill();
  ctx.strokeStyle = '#444'; ctx.lineWidth = 0.006 * u;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x - 0.06 * u, by - 0.515 * u + i * 0.02 * u); ctx.lineTo(x + 0.06 * u, by - 0.515 * u + i * 0.02 * u); ctx.stroke(); }
  drawMiloHead(x, by - 0.74 * u, u, o, lit);
  ctx.restore();
}

function drawMiloHead(x, hy, u, o, lit) {
  const t = o.t || 0, expr = o.expr || 'happy';
  ctx.save();
  ctx.translate(x, hy); ctx.rotate(o.tilt || 0); ctx.translate(-x, -hy);
  const hw = 0.64 * u, hh = 0.46 * u;
  // antenna (on Milo's right = viewer's left in front view)
  const ax = x - 0.2 * u, ay = hy - hh / 2 + 0.03 * u;
  const tipX = ax - 0.1 * u + (o.antLean || 0) * u, tipY = ay - 0.2 * u;
  ctx.strokeStyle = MC.joint; ctx.lineWidth = 0.018 * u; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(tipX, tipY); ctx.stroke();
  const pulse = o.antPulse || 0;
  glow(tipX, tipY, (0.09 + pulse * 0.06) * u, MC.cyan, (0.7 + pulse * 0.3) * lit);
  ctx.fillStyle = lit < 1 ? '#1a6a72' : '#8ff6ff'; ctx.beginPath(); ctx.arc(tipX, tipY, 0.03 * u, 0, TAU); ctx.fill();
  // ear discs
  for (const sd of [-1, 1]) {
    const ex = x + sd * (hw / 2 + 0.01 * u), ey = hy + 0.02 * u;
    ctx.fillStyle = MC.tealD; ctx.beginPath(); ctx.ellipse(ex, ey, 0.065 * u, 0.1 * u, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = MC.teal; ctx.beginPath(); ctx.ellipse(ex + sd * 0.012 * u, ey, 0.055 * u, 0.088 * u, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(ex + sd * 0.018 * u, ey);
    if (o.earSpin) ctx.rotate(t * 6);
    ctx.strokeStyle = MC.cyan; ctx.globalAlpha = lit; ctx.lineWidth = 0.014 * u;
    ctx.beginPath(); ctx.ellipse(0, 0, 0.032 * u, 0.055 * u, 0, o.earSpin ? 0.5 : 0, o.earSpin ? TAU - 0.5 : TAU); ctx.stroke();
    ctx.restore();
    glow(ex + sd * 0.018 * u, ey, 0.07 * u, MC.cyan, 0.35 * lit);
  }
  // helmet
  const hg = ctx.createLinearGradient(x - hw / 2, hy - hh / 2, x + hw / 3, hy + hh / 2);
  hg.addColorStop(0, '#fffaf0'); hg.addColorStop(0.6, MC.shell); hg.addColorStop(1, MC.shellD);
  ctx.fillStyle = hg; rrect(x - hw / 2, hy - hh / 2, hw, hh, 0.2 * u); ctx.fill();
  ctx.fillStyle = MC.teal; rrect(x - 0.06 * u, hy - hh / 2 + 0.018 * u, 0.12 * u, 0.018 * u, 0.009 * u); ctx.fill();
  // scuffs
  ctx.strokeStyle = 'rgba(120,100,80,0.3)'; ctx.lineWidth = 0.004 * u;
  ctx.beginPath(); ctx.moveTo(x + 0.2 * u, hy - 0.17 * u); ctx.lineTo(x + 0.24 * u, hy - 0.15 * u); ctx.stroke();
  // visor
  const vw = 0.52 * u, vh = 0.32 * u, vy = hy + 0.025 * u;
  ctx.fillStyle = MC.visor; rrect(x - vw / 2, vy - vh / 2, vw, vh, 0.13 * u); ctx.fill();
  ctx.strokeStyle = '#2b3138'; ctx.lineWidth = 0.012 * u; ctx.stroke();
  // gloss
  ctx.save(); rrect(x - vw / 2, vy - vh / 2, vw, vh, 0.13 * u); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.ellipse(x - 0.06 * u, vy - vh / 2, vw * 0.5, vh * 0.35, -0.1, 0, TAU); ctx.fill();
  ctx.restore();
  drawEyes(x, vy, u, o, lit);
  ctx.restore();
}

function drawEyes(x, vy, u, o, lit) {
  const t = o.t || 0; let expr = o.expr || 'happy';
  const col = eyeColor(o);
  const blink = !o.noBlink && (t % 4.3) < 0.12;
  if (blink && expr !== 'sleep') expr = 'blink';
  const ex = 0.11 * u, r = 0.058 * u, lw = 0.034 * u;
  ctx.save();
  ctx.globalAlpha = lit;
  ctx.lineCap = 'round';
  for (const sd of [-1, 1]) {
    const cx = x + sd * ex; let cy = vy + 0.025 * u;
    const pass = (glowPass) => {
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.lineWidth = glowPass ? lw * 2.4 : lw;
      ctx.globalAlpha = (glowPass ? 0.22 : 1) * lit;
      ctx.beginPath();
      switch (expr) {
        case 'happy': case 'remember':
          ctx.arc(cx, cy, r, Math.PI * 1.05, Math.PI * 1.95); break;
        case 'curious': {
          const rr = sd > 0 ? r * 1.25 : r * 0.85; ctx.arc(cx, cy - (sd > 0 ? 0.015 * u : 0), rr, Math.PI * 1.05, Math.PI * 1.95); break;
        }
        case 'scared': {
          const j = Math.sin(t * 50) * 0.004 * u; ctx.arc(cx + j, cy - 0.01 * u, r * 0.45, 0, TAU); break;
        }
        case 'sad':
          ctx.arc(cx, cy - 0.04 * u, r * 0.9, Math.PI * 0.15, Math.PI * 0.85); break;
        case 'determined':
          ctx.moveTo(cx - r, cy - 0.02 * u); ctx.lineTo(cx + r, cy - 0.02 * u); break;
        case 'surprised':
          ctx.arc(cx, cy - 0.015 * u, r * 0.8, 0, TAU); break;
        case 'sleep': case 'blink':
          ctx.moveTo(cx - r * 0.9, cy - 0.01 * u); ctx.lineTo(cx + r * 0.9, cy - 0.01 * u); break;
        case 'star':
          starPath(cx, cy - 0.015 * u, r * 0.95, r * 0.42); break;
      }
      if (expr === 'star') { if (!glowPass) ctx.fill(); else ctx.stroke(); } else ctx.stroke();
    };
    pass(true); pass(false);
    // brows
    ctx.globalAlpha = 0.9 * lit; ctx.lineWidth = lw * 0.55; ctx.strokeStyle = col;
    ctx.beginPath();
    const bY = cy - 0.1 * u;
    if (expr === 'determined') { ctx.moveTo(cx - sd * 0.05 * u, bY - 0.01 * u); ctx.lineTo(cx + sd * 0.01 * u, bY + 0.012 * u); }
    else if (expr === 'curious' && sd > 0) { ctx.moveTo(cx - 0.03 * u, bY - 0.03 * u); ctx.lineTo(cx + 0.03 * u, bY - 0.035 * u); }
    else if (expr === 'sad') { ctx.moveTo(cx - sd * 0.035 * u, bY + 0.012 * u); ctx.lineTo(cx + sd * 0.025 * u, bY - 0.005 * u); }
    else if (expr === 'scared' || expr === 'surprised') { ctx.moveTo(cx - 0.03 * u, bY - 0.02 * u); ctx.lineTo(cx + 0.03 * u, bY - 0.02 * u); }
    else if (expr !== 'sleep') { ctx.moveTo(cx - 0.028 * u, bY); ctx.lineTo(cx + 0.028 * u, bY); }
    ctx.stroke();
    // memory star inside the arc
    if (expr === 'remember') {
      ctx.globalAlpha = (0.6 + Math.sin(t * 6) * 0.4) * lit; ctx.fillStyle = '#bfe0ff';
      starPath(cx, cy - 0.025 * u, 0.022 * u, 0.01 * u); ctx.fill();
    }
  }
  ctx.restore();
}

function starPath(cx, cy, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

/* back view (during runs, camera behind Milo) */
function drawMiloBack(x, gy, s, o) {
  o = o || {};
  const u = s, t = o.t || 0;
  const lit = o.dim ? 0.3 : 1;
  const walk = o.walk ? t * 10 : 0;
  const bob = o.walk ? Math.abs(Math.sin(walk)) * 0.03 * u : 0;
  ctx.save();
  // shadow on ground (stays at ground when jumping)
  const sg = o.shadowY !== undefined ? o.shadowY : gy;
  const shrink = clamp(1 - (sg - gy) / (u * 1.2), 0.4, 1);
  if (!o.noShadow) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(x, sg, u * 0.3 * shrink, u * 0.06 * shrink, 0, 0, TAU); ctx.fill();
    glow(x, sg + u * 0.05, u * 0.55, MC.cyan, 0.16 * lit);
  }
  ctx.translate(x, gy); ctx.rotate(o.lean || 0); ctx.translate(-x, -gy);
  // feet
  for (const sd of [-1, 1]) {
    const lift = o.walk ? Math.max(0, Math.sin(walk + (sd > 0 ? 0 : Math.PI))) * 0.05 * u : 0;
    const sx = x + sd * 0.13 * u, sy = gy - 0.05 * u - lift;
    ctx.fillStyle = MC.joint; rrect(sx - 0.035 * u, gy - 0.2 * u - lift, 0.07 * u, 0.13 * u, 0.02 * u); ctx.fill();
    ctx.fillStyle = MC.shell; ctx.beginPath(); ctx.ellipse(sx, sy, 0.1 * u, 0.055 * u, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = MC.teal; rrect(sx - 0.1 * u, sy - 0.005 * u, 0.2 * u, 0.018 * u, 0.008 * u); ctx.fill();
  }
  const by = gy - bob;
  // arms at sides
  for (const sd of [-1, 1]) {
    const sw = o.walk ? Math.sin(walk + (sd > 0 ? Math.PI : 0)) * 0.15 : 0;
    ctx.save(); ctx.translate(x + sd * 0.21 * u, by - 0.4 * u); ctx.rotate(sd * 0.3 + sw + (o.armsUp ? -sd * 1.8 : 0));
    ctx.fillStyle = MC.joint; ctx.beginPath(); ctx.arc(0, 0, 0.04 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = MC.shell; rrect(-0.045 * u, 0.04 * u, 0.09 * u, 0.1 * u, 0.035 * u); ctx.fill();
    ctx.fillStyle = MC.joint; ctx.beginPath(); ctx.arc(0, 0.165 * u, 0.032 * u, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // body
  ctx.fillStyle = MC.shellD; ctx.beginPath(); ctx.ellipse(x, by - 0.32 * u, 0.19 * u, 0.165 * u, 0, 0, TAU); ctx.fill();
  // backpack
  const pg = ctx.createLinearGradient(x - 0.23 * u, 0, x + 0.23 * u, 0);
  pg.addColorStop(0, '#24a199'); pg.addColorStop(1, MC.tealD);
  ctx.fillStyle = pg; rrect(x - 0.23 * u, by - 0.55 * u, 0.46 * u, 0.36 * u, 0.06 * u); ctx.fill();
  ctx.fillStyle = MC.shell;
  for (const [cx, cy] of [[-0.23, -0.55], [0.17, -0.55], [-0.23, -0.25], [0.17, -0.25]]) { rrect(x + cx * u, by + cy * u, 0.06 * u, 0.06 * u, 0.02 * u); ctx.fill(); }
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.008 * u;
  ctx.beginPath(); ctx.moveTo(x - 0.2 * u, by - 0.45 * u); ctx.lineTo(x + 0.2 * u, by - 0.45 * u); ctx.stroke();
  // the star (grimy until chapter 2, clean after Luna wipes it)
  if (o.star !== undefined) {
    ctx.globalAlpha = o.star ? 0.95 : 0.18;
    ctx.fillStyle = o.star ? '#4d7dff' : '#2a5a58';
    starPath(x, by - 0.36 * u, 0.075 * u, 0.032 * u); ctx.fill();
    if (o.star) { ctx.strokeStyle = '#a8c4ff'; ctx.lineWidth = 0.006 * u; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  const packCol = o.pack === 'amber' ? MC.amber : o.pack === 'off' ? '#2a3a3a' : MC.cyan;
  ctx.fillStyle = packCol; rrect(x + 0.2 * u, by - 0.45 * u, 0.025 * u, 0.08 * u, 0.01 * u); ctx.fill();
  if (o.pack !== 'off') glow(x + 0.215 * u, by - 0.41 * u, 0.06 * u, packCol, 0.9 * lit);
  // head from behind
  const hy = by - 0.76 * u, hw = 0.64 * u, hh = 0.46 * u;
  ctx.fillStyle = MC.joint; rrect(x - 0.06 * u, by - 0.58 * u, 0.12 * u, 0.08 * u, 0.02 * u); ctx.fill();
  ctx.save(); ctx.translate(x, hy); ctx.rotate(o.tilt || 0); ctx.translate(-x, -hy);
  // antenna (Milo's right = viewer's right from behind)
  const ax = x + 0.2 * u, ay = hy - hh / 2 + 0.03 * u, tipX = ax + 0.1 * u + (o.antLean || 0) * u, tipY = ay - 0.2 * u;
  ctx.strokeStyle = MC.joint; ctx.lineWidth = 0.018 * u; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(tipX, tipY); ctx.stroke();
  const pulse = o.antPulse || 0;
  glow(tipX, tipY, (0.1 + pulse * 0.08) * u, MC.cyan, (0.75 + pulse * 0.25) * lit);
  ctx.fillStyle = lit < 1 ? '#1a6a72' : '#8ff6ff'; ctx.beginPath(); ctx.arc(tipX, tipY, 0.03 * u, 0, TAU); ctx.fill();
  for (const sd of [-1, 1]) {
    const ex = x + sd * (hw / 2 + 0.005 * u);
    ctx.fillStyle = MC.teal; ctx.beginPath(); ctx.ellipse(ex, hy + 0.02 * u, 0.06 * u, 0.095 * u, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = MC.cyan; ctx.globalAlpha = lit; ctx.lineWidth = 0.012 * u;
    ctx.beginPath(); ctx.ellipse(ex + sd * 0.01 * u, hy + 0.02 * u, 0.03 * u, 0.055 * u, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const hg = ctx.createLinearGradient(x - hw / 2, hy - hh / 2, x + hw / 2, hy + hh / 2);
  hg.addColorStop(0, '#fbf5ea'); hg.addColorStop(1, '#cdbfa8');
  ctx.fillStyle = hg; rrect(x - hw / 2, hy - hh / 2, hw, hh, 0.2 * u); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; rrect(x - 0.12 * u, hy + 0.04 * u, 0.24 * u, 0.1 * u, 0.04 * u); ctx.fill();
  ctx.fillStyle = MC.teal; rrect(x - 0.08 * u, hy - hh / 2 + 0.02 * u, 0.16 * u, 0.018 * u, 0.009 * u); ctx.fill();
  // little side visor glimpse when looking around
  if (o.peek) {
    const sd = o.peek;
    ctx.fillStyle = MC.visor; rrect(x + sd * 0.18 * u - 0.06 * u, hy - 0.08 * u, 0.12 * u, 0.2 * u, 0.05 * u); ctx.fill();
    ctx.strokeStyle = MC.cyan; ctx.lineWidth = 0.02 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x + sd * 0.2 * u, hy + 0.03 * u, 0.03 * u, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

      ctx.beginPath(); ctx.ellipse(x + 0.065 * u, gy - 0.64 * u, 0.035 * u, (t % 3.5 < .15 ? 0.006 : 0.03) * u, 0, 0, TAU); ctx.fill();

      ctx.fillStyle = shawl; ctx.beginPath(); ctx.moveTo(x - 0.24 * u, gy - 0.45 * u); ctx.quadraticCurveTo(x, gy - 0.3 * u, x + 0.24 * u, gy - 0.45 * u); ctx.lineTo(x + 0.15 * u, gy - 0.72 * u); ctx.lineTo(x - 0.15 * u, gy - 0.72 * u); ctx.fill();
      ctx.fillStyle = '#e8c4a8'; ctx.beginPath(); ctx.arc(x, gy - 0.82 * u, 0.12 * u, 0, TAU); ctx.fill();
      ctx.fillStyle = who === 'mira' ? '#d8d8e0' : '#5a3a2a'; ctx.beginPath(); ctx.arc(x, gy - 0.86 * u, 0.12 * u, Math.PI, TAU); ctx.fill();

      if (who === 'mira') {

        ctx.beginPath(); ctx.moveTo(x + 0.25 * u, gy - 0.1 * u); ctx.lineTo(x + 0.25 * u, gy - 1.05 * u); ctx.stroke();
        ctx.fillStyle = '#c4a8e8'; ctx.beginPath(); ctx.arc(x + 0.25 * u, gy - 1.02 * u, 0.32 * u, Math.PI, TAU); ctx.fill();
        ctx.strokeStyle = '#9a80c0'; ctx.lineWidth = 0.01 * u;

      if (who === 'luna') { ctx.beginPath(); ctx.moveTo(x - 0.18 * u, gy - 0.78 * u); ctx.lineTo(x + 0.18 * u, gy - 0.78 * u); ctx.lineTo(x, gy - 0.98 * u); ctx.fill(); }

/* ---------- icons (notebook, puzzles) ---------- */
function drawIcon(name, x, y, s, col, v) {
  col = col || '#f4ecdc';
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1.5, s * 0.08); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const u = s / 2;
  switch (name) {
    case 'star': starPath(0, 0, u, u * 0.45); ctx.fill(); break;
    case 'loaf':
      ctx.beginPath(); ctx.moveTo(-u, u * 0.5); ctx.lineTo(-u, 0); ctx.quadraticCurveTo(-u, -u * 0.8, 0, -u * 0.8); ctx.quadraticCurveTo(u, -u * 0.8, u, 0); ctx.lineTo(u, u * 0.5); ctx.closePath(); ctx.stroke();

    case 'clock':
      ctx.beginPath(); ctx.arc(0, 0, u * 0.9, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -u * 0.6); ctx.moveTo(0, 0); ctx.lineTo(u * 0.45, u * 0.1); ctx.stroke(); break;
    case 'bird':
      ctx.beginPath(); ctx.moveTo(-u, 0); ctx.lineTo(u * 0.2, -u * 0.25); ctx.lineTo(u, -u * 0.8); ctx.lineTo(u * 0.5, u * 0.1); ctx.lineTo(u * 0.9, u * 0.5); ctx.lineTo(-u * 0.2, u * 0.2); ctx.closePath(); ctx.stroke(); break;
    case 'eye':
      ctx.beginPath(); ctx.ellipse(0, 0, u, u * 0.55, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = MC.amber; ctx.beginPath(); ctx.arc(0, 0, u * 0.32, 0, TAU); ctx.fill(); break;
    case 'umbrella':
      ctx.beginPath(); ctx.arc(0, 0, u, Math.PI, TAU); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, u * 0.8); ctx.arc(-u * 0.2, u * 0.8, u * 0.2, 0, Math.PI); ctx.stroke(); break;
    case 'heart':
      ctx.beginPath(); ctx.arc(0, 0, u * 0.85, 0, TAU); ctx.stroke(); glow(0, 0, u * 1.2, '#5a8cff', 0.7); ctx.beginPath(); ctx.arc(0, 0, u * 0.3, 0, TAU); ctx.fill(); break;
    case 'letter':
      ctx.strokeRect(-u, -u * 0.65, u * 2, u * 1.3); ctx.beginPath(); ctx.moveTo(-u, -u * 0.65); ctx.lineTo(0, u * 0.1); ctx.lineTo(u, -u * 0.65); ctx.stroke(); break;
    case 'photo':
      ctx.strokeRect(-u, -u * 0.75, u * 2, u * 1.5); ctx.beginPath(); ctx.arc(-u * 0.4, -u * 0.1, u * 0.25, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(u * 0.1, u * 0.5); ctx.lineTo(u * 0.1, -u * 0.3); ctx.stroke(); break;
    case 'house':
      ctx.beginPath(); ctx.moveTo(-u, 0); ctx.lineTo(0, -u); ctx.lineTo(u, 0); ctx.lineTo(u * 0.75, 0); ctx.lineTo(u * 0.75, u); ctx.lineTo(-u * 0.75, u); ctx.lineTo(-u * 0.75, 0); ctx.closePath(); ctx.stroke();

    case 'signal':
      for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(-u * 0.6, u * 0.4, u * 0.45 * i, -Math.PI / 2.4, 0); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(-u * 0.6, u * 0.4, u * 0.12, 0, TAU); ctx.fill(); break;

/* =========================================================
   JUNO VALE — the main character, Pip's fastest courier.
   Deep brown skin, short natural coily hair, light-wash denim
   vest over a black crop top, dark frayed denim shorts, olive
   backpack, beaded bracelets, chunky black-and-white sneakers.
   Rides an electric scooter with Milo in the crate on the back.
   ========================================================= */
const JC = {
  hair: '#1c1310', hairL: '#3a2a22', skin: '#7a4a32', skinD: '#5a3220', skinL: '#a06a4a',
  vest: '#7d9cc0', vestD: '#56739a', vestL: '#b4cbe2', top: '#17161c', topL: '#2c2a34',
  shorts: '#3a3940', shortsD: '#26252b', shortsL: '#5a5964', fray: '#8a8a96',
  pack: '#5d6b3c', packD: '#3f4a28', packL: '#7d8c52',
  shoe: '#18181c', sole: '#f4f4f6', lace: '#ffffff', lip: '#6a3a32', eye: '#1a0f0c'

function limb(x1, y1, x2, y2, w1, w2, col) {
  const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a), ny = Math.cos(a);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x1 + nx * w1, y1 + ny * w1); ctx.lineTo(x2 + nx * w2, y2 + ny * w2);
  ctx.lineTo(x2 - nx * w2, y2 - ny * w2); ctx.lineTo(x1 - nx * w1, y1 - ny * w1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(x1, y1, w1, 0, TAU); ctx.arc(x2, y2, w2, 0, TAU); ctx.fill();
}
/* short natural coily hair: a rounded crown built from many small curls */
function coils(cx, cy, rx, ry, r, seed) {
  ctx.fillStyle = JC.hair; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 46; i++) {
    const a = hash(i, seed) * TAU, d = Math.sqrt(hash(i, seed + 1));
    const px = cx + Math.cos(a) * rx * d, py = cy + Math.sin(a) * ry * d;
    ctx.fillStyle = hash(i, seed + 2) < 0.45 ? JC.hairL : JC.hair;
    ctx.beginPath(); ctx.arc(px, py, r * (0.7 + hash(i, seed + 3) * 0.6), 0, TAU); ctx.fill();

  for (let i = 0; i < 26; i++) { // curly outline
    const a = i / 26 * TAU; ctx.fillStyle = JC.hair;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, r * 1.05, 0, TAU); ctx.fill();
  }
}

        new PzToggles(this, { n: 5, label: 'Petal 3: light every ring' }),

    } else if (pz.type === 'pattern') this.stages = [new PzPattern(this, pz)];

/* =========================================================
   SCENES: title, city map, story cards, results, chapter
   memories, repair shop, notebook, settings, the ending
   ========================================================= */
let nextScene = null, fadeA = 0, fadeDir = 0;
function go(s) { nextScene = s; fadeDir = 1; }
function startLevel(n) {
  const L = LEVELS[n];
  const firstOfCh = (n - 1) % 10 === 0;
  if (firstOfCh && !S.chapterSeen[L.ch]) go(new ChapterIntroScene(L.ch, n));
  else go(new StoryScene(n));
}
function playLevel(n) { const L = LEVELS[n]; go(L.run === false ? new PuzzleScene(n, null) : new RunScene(n)); }

function finishLevel(res) {
  const L = LEVELS[res.n];
  const rec = S.lv[res.n] || { frags: [false, false, false], post: false, stars: [false, false, false] };
  const stars = [true, res.frags.every(Boolean), !!res.clean];
  const newFr = res.frags.filter((f, i) => f && !rec.frags[i]).length;
  rec.frags = rec.frags.map((f, i) => f || !!res.frags[i]);
  rec.post = rec.post || !!res.post;
  if (res.timeLeft !== null && res.timeLeft !== undefined) rec.best = Math.max(rec.best || 0, res.timeLeft);
  rec.stars = rec.stars.map((s, i) => s || stars[i]);
  S.lv[res.n] = rec;
  const bonus = stars.filter(Boolean).length * 10;
  S.bolts += res.bolts + bonus;
  S.unlocked = Math.max(S.unlocked, Math.min(MAXLV, res.n + 1));
  if (L.note) addNote(L.note);
  save();
  if (res.n === MAXLV) { go(new EndingScene()); return; }
  go(new ResultScene(res, stars, bonus, newFr));
}
function chapterFrags(ch) { let c = 0; for (let n = (ch - 1) * 10 + 1; n <= ch * 10; n++) { const r = S.lv[n]; if (r) c += r.frags.filter(Boolean).length; } return c; }
function totalFrags() { let c = 0; for (const k in S.lv) c += S.lv[k].frags.filter(Boolean).length; return c; }
function totalPosts() { let c = 0; for (const k in S.lv) if (S.lv[k].post) c++; return c; }

/* ---------------- City map (Lantern Quarter at the bottom, the tower at the top) ---------------- */
const NODE_GAP = 78;
class MapScene {
  constructor(focus) {
    this.t = 0; this.dragScroll = true; this.vel = 0;
    this.focus = focus || S.unlocked;
    this.scroll = this.nodeY(clamp(this.focus, 1, MAXLV)) - H * 0.55;
    this.clampScroll();
    setRain(0.1); setHum(0);
  }
  nodeY(n) { return (MAXLV - n) * NODE_GAP + 260 + Math.floor((MAXLV - n) / 10) * 0 + (6 - Math.ceil(n / 10)) * 90; }
  nodeX(n) { return W / 2 + Math.sin(n * 0.85) * 120; }
  get total() { return this.nodeY(1) + 300; }
  clampScroll() { this.scroll = clamp(this.scroll, 0, Math.max(0, this.total - H)); }
  update(dt) {
    this.t += dt;
    if (!ptr) { this.scroll += this.vel * dt; this.vel *= Math.pow(0.04, dt); this.clampScroll(); }
  }
  onDrag(dx, dy) { this.scroll -= dy; this.vel = -dy * 60; this.clampScroll(); }
  onDown() { this.vel = 0; }
  btns() { return { shop: { x: 12, y: H - 70, w: (W - 48) / 3, h: 54 }, notes: { x: 24 + (W - 48) / 3, y: H - 70, w: (W - 48) / 3, h: 54 }, set: { x: 36 + 2 * (W - 48) / 3, y: H - 70, w: (W - 48) / 3, h: 54 } }; }
  get shiftBtn() { return { x: 12, y: H - 140, w: W - 24, h: 54 }; }
  onTap(x, y) {
    const b = this.btns();
    if (inside(this.shiftBtn, x, y)) {
      if (S.unlocked > 5) { SFX.chirp(); go(new RunScene(0, { L: makeNightShift() })); } else SFX.bad();
      return;
    }
    if (inside(b.shop, x, y)) { SFX.ui(); go(new ShopScene()); return; }
    if (inside(b.notes, x, y)) { SFX.ui(); go(new NotebookScene()); return; }
    if (inside(b.set, x, y)) { SFX.ui(); go(new SettingsScene()); return; }
    if (y < 70) return;
    for (let n = 1; n <= MAXLV; n++) {
      const nx = this.nodeX(n), ny = this.nodeY(n) - this.scroll;
      if (Math.hypot(x - nx, y - ny) < 32) {
        if (n <= S.unlocked) { SFX.chirp(); startLevel(n); } else SFX.bad();
        return;
      }
    }
  }
  back() { go(new TitleScene()); return true; }
  draw() {
    const sc = this.scroll, t = this.t;
    // sky gradient that climbs from warm streets to the blue tower
    const g = ctx.createLinearGradient(0, -sc, 0, this.total - sc);
    g.addColorStop(0, '#0a0220'); g.addColorStop(0.2, '#2a0a5a'); g.addColorStop(0.4, '#4a1460'); g.addColorStop(0.6, '#8a2a6a');
    g.addColorStop(0.8, '#ff7a5a'); g.addColorStop(1, '#2a0f4a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // tower at the very top
    const ty = 120 - sc;
    if (ty > -400) {
      glow(W / 2, ty, 200, '#5a8cff', S.ending ? 1 : 0.5);
      ctx.fillStyle = '#0d1230'; ctx.beginPath(); ctx.moveTo(W / 2 - 60, ty + 260); ctx.lineTo(W / 2 - 8, ty - 40); ctx.lineTo(W / 2 + 8, ty - 40); ctx.lineTo(W / 2 + 60, ty + 260); ctx.fill();
      ctx.fillStyle = S.ending ? '#cfe0ff' : 'rgba(160,190,255,0.5)'; starPath(W / 2, ty - 50, 18, 8); ctx.fill();
    }
    // chapter districts
    for (let c = 1; c <= 6; c++) {
      const C = CHAPTERS[c - 1];
      const yTop = this.nodeY(c * 10) - sc - 50, yBot = this.nodeY((c - 1) * 10 + 1) - sc + 50;
      if (yBot < -100 || yTop > H + 100) continue;
      ctx.fillStyle = rgba(C.col, 0.06); ctx.fillRect(0, yTop, W, yBot - yTop);
      for (let i = 0; i < 9; i++) { const bx = hash(i, c) * W, bh = 30 + hash(i, c + 5) * 90, by = yBot - 10; ctx.fillStyle = rgba(C.col, 0.08); ctx.fillRect(bx, by - bh, 26, bh); }
      text(`${c}. ${C.district}`, 14, yBot - 14, 13, rgba(C.col, 0.9), 'left', 'bold');
      text(C.name, 14, yBot + 4, 11, 'rgba(244,236,220,0.6)', 'left');
    }
    // path
    ctx.strokeStyle = 'rgba(244,236,220,0.18)'; ctx.lineWidth = 6; ctx.setLineDash([2, 12]); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let n = 1; n <= MAXLV; n++) { const x = this.nodeX(n), y = this.nodeY(n) - sc; n === 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke(); ctx.setLineDash([]);
    // nodes
    for (let n = 1; n <= MAXLV; n++) {
      const x = this.nodeX(n), y = this.nodeY(n) - sc;
      if (y < -40 || y > H + 40) continue;
      const L = LEVELS[n], C = CHAPTERS[L.ch - 1], rec = S.lv[n], open = n <= S.unlocked, cur = n === S.unlocked;
      if (cur) glow(x, y, 60, C.col, 0.6 + 0.3 * Math.sin(t * 3));
      ctx.fillStyle = open ? (rec ? C.col : '#f4ecdc') : 'rgba(30,30,50,0.9)';
      ctx.beginPath(); ctx.arc(x, y, 24, 0, TAU); ctx.fill();
      ctx.strokeStyle = open ? '#ffffff' : 'rgba(244,236,220,0.2)'; ctx.lineWidth = 2.5; ctx.stroke();
      text(String(n), x, y + 1, 16, open ? '#1a1430' : 'rgba(244,236,220,0.35)', 'center', 'bold');
      if (L.run === false && open) { ctx.fillStyle = '#1a1430'; text('?', x + 17, y - 17, 12, '#ffe7a0', 'center', 'bold'); }
      if (rec) for (let i = 0; i < 3; i++) { ctx.fillStyle = rec.stars[i] ? '#9fc0ff' : 'rgba(159,192,255,0.2)'; starPath(x - 16 + i * 16, y + 34, 6, 2.6); ctx.fill(); }
      if (open) text(L.name, x + (x > W / 2 ? -34 : 34), y, 12, 'rgba(244,236,220,0.75)', x > W / 2 ? 'right' : 'left');
      if (cur) drawMiloFront(x, y - 30, 46, { t, expr: 'happy', pack: 'cyan' });
    }
    // header
    ctx.fillStyle = 'rgba(6,8,20,0.8)'; ctx.fillRect(0, 0, W, 60);
    heading('AURELIA', 20, 30, 28, { align: 'left' });
    drawIcon('gear', W - 120, 30, 16, '#c8d0d8'); text(String(S.bolts), W - 106, 31, 16, '#c8d0d8', 'left', 'bold');
    ctx.fillStyle = '#ffd36a'; ctx.beginPath(); ctx.moveTo(W - 50, 22); ctx.lineTo(W - 44, 30); ctx.lineTo(W - 50, 38); ctx.lineTo(W - 56, 30); ctx.fill();
    text(String(totalFrags()), W - 38, 31, 16, '#ffd36a', 'left', 'bold');
    const b = this.btns();
    ctx.fillStyle = 'rgba(6,8,20,0.85)'; ctx.fillRect(0, H - 82, W, 82);
    button(b.shop, 'Repair Shop', { px: 14 }); button(b.notes, 'Notebook', { px: 14 }); button(b.set, 'Settings', { px: 14 });
    ctx.fillStyle = 'rgba(6,8,20,0.85)'; ctx.fillRect(0, H - 148, W, 66);
    const E = S.endless || { best: 0, dayBest: 0 }, day = nightShiftDay();
    const city = SHIFT_CITIES[day % SHIFT_CITIES.length][0];
    const cityName = { street: 'Lamp Row', storm: 'Spire Avenue', oldtown: 'Old Town', heart: 'The Heart', alley: 'Crate Alley', roofstorm: 'Storm Rooftops', trainroof: 'The Loop Line' }[city];
    if (S.unlocked > 5) button(this.shiftBtn, `Night Shift · ${cityName} · Best ${E.day === day ? E.dayBest : 0}`, { hot: true, px: 15 });
    else button(this.shiftBtn, 'Night Shift · unlocks after level 5', { px: 14, col: 'rgba(255,244,230,0.5)' });
  }
}

/* ---------------- The ending (Part 12) ---------------- */
class EndingScene {
  constructor() {
    this.t = 0; S.ending = true; save();
    this.w = new World('sunrise', { ch: 6, tower: -1 });
    setRain(0); setHum(0);
    this.played = {};
    this.R = mulberry(60);
    this.wins = []; for (let i = 0; i < 260; i++) this.wins.push({ x: this.R() * W, y: H * (0.42 + this.R() * 0.3), on: 8 + this.R() * 28 });
  }
  cue(id, at, fn) { if (this.t >= at && !this.played[id]) { this.played[id] = true; fn(); } }
  update(dt) {
    this.t += dt; this.w.update(dt);
    this.cue('c', 0.1, () => tone(659, 1.4, 'sine', 0.1));
    this.cue('tune1', 3, () => playTune(0.45, 0.06));
    this.cue('tune2', 18, () => playTune(0.42, 0.07, 0.5));
    this.cue('hum', 30, () => playTune(0.5, 0.05));
    this.cue('end', 46, () => SFX.reboot());

  onTap() { if (this.t > 50) { SFX.ui(); go(new MapScene(MAXLV)); } else if (this.t > 8 && this.t < 44) this.t = Math.min(44, this.t + 3); }

    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const sunY = hz + 30 - k * 70;
    glow(W / 2, sunY, 300, '#ffd890', 0.4 + k * 0.5);
    ctx.fillStyle = '#fff2c8'; ctx.beginPath(); ctx.arc(W / 2, sunY, 36, 0, TAU); ctx.fill();
    // the city below, lighting up district by district
    ctx.fillStyle = '#1e1a36'; ctx.fillRect(0, hz, W, H - hz);
    for (let i = 0; i < 40; i++) { const bx = hash(i, 2) * W, bh = 40 + hash(i, 3) * 160; ctx.fillStyle = mix('#2a2448', '#4a4a6a', hash(i, 4)); ctx.fillRect(bx, hz + 120 - bh * 0.6, 30 + hash(i, 5) * 30, bh + 200); }
    for (const w of this.wins) { if (t > w.on) { ctx.fillStyle = '#ffd890'; ctx.fillRect(w.x, w.y, 3, 4); } }
    // lamp row lights, first to return
    for (let i = 0; i < 12; i++) if (t > 5 + i * 0.4) glow(30 + i * 36, H * 0.72, 18, '#ffcf86', 0.8);
    // rooftop
    ctx.fillStyle = '#3a3f5a'; ctx.fillRect(0, H * 0.78, W, H * 0.22);
    ctx.fillStyle = '#4a4f6a'; ctx.fillRect(0, H * 0.78, W, 8);
    // beacon behind
    const bx = W * 0.82;
    ctx.fillStyle = '#5a5f7a'; ctx.fillRect(bx - 6, H * 0.52, 12, H * 0.26);
    glow(bx, H * 0.5, 120, '#4d7dff', 0.9); ctx.fillStyle = '#cfe0ff'; starPath(bx, H * 0.5, 22, 9); ctx.fill();
    // Milo, the empty package, and (later) Luna and Mira
    const gy = H * 0.86;
    const eyes = t > 36 ? 'star' : t > 26 ? 'remember' : 'happy';
    drawMiloFront(W * 0.42, gy, 120, { t, expr: eyes, eyeCol: t > 36 ? '#3a7bff' : undefined, pack: 'off', earSpin: t > 30 && t < 36, reflect: true });
    ctx.fillStyle = '#c8a878'; rrect(W * 0.55, gy - 22, 34, 22, 3); ctx.fill(); ctx.fillStyle = '#2a1a10'; ctx.fillRect(W * 0.55 + 3, gy - 22, 28, 5);

    cap(1, 6, 'The beacon lights deep blue.');

    cap(12, 17, 'Under the city, NORA looks up as every tunnel light returns.');
    cap(17, 22, 'All over Aurelia, people stop at their windows, as if hearing something.');
    cap(23, 29, S.stamps.umbrella ? 'An old woman with a lilac umbrella sees the star on Milo\'s backpack, and hums.' : 'An old woman sees the star on Milo\'s backpack, and hums.');
    cap(30, 36, '"You\'re finally home."', H * 0.3);
    if (t > 40) {
      ctx.fillStyle = `rgba(0,0,0,${clamp((t - 40) / 3, 0, 1)})`; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = clamp((t - 43) / 2, 0, 1);
      textBlock('SOME MESSAGES TAKE A LIFETIME TO ARRIVE.', W / 2, H * 0.45, W - 60, 22, '#ffffff', 'center', 30, 'bold');
      ctx.globalAlpha = clamp((t - 48) / 2, 0, 1);
      text('Thank you for playing.', W / 2, H * 0.62, 15, '#9fe8ff');

}
/* =========================================================
   POSTER ART: painted sunset backdrops for the title, level
   cards, chapter cards and results. Original artwork drawn in code.
   ========================================================= */
const POSTER_PAL = [
  ['#1a0838', '#5a1a6a', '#d0306a', '#ff7a4a', '#ffc46a'],   // ch1 sunset
  ['#2a1450', '#8a3a7a', '#ff6f61', '#ffb06a', '#ffe0a0'],   // ch2 golden hour
  ['#04020e', '#120a2e', '#2a0f4a', '#1a6a7a', '#22e4d4'],   // ch3 underground teal
  ['#1a1040', '#4a2a7a', '#c05a9a', '#ffa0c0', '#fff0f6'],   // ch4 pastel lab dusk
  ['#06021a', '#1e0840', '#4a1060', '#a01a7a', '#ff4aa0'],   // ch5 storm neon
  ['#020212', '#0a0a3a', '#2a1a7a', '#5a4ad0', '#9fc0ff']    // ch6 the Heart
];
let _grain = null, _posterCache = {};
function grainCanvas() {
  if (_grain) return _grain;
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d'), d = g.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; }
  g.putImageData(d, 0, 0); _grain = c; return c;
}
function posterStatic(ch) {
  const key = ch + ':' + Math.round(H);
  if (_posterCache[key]) return _posterCache[key];
  const c = document.createElement('canvas'); c.width = W * 2; c.height = Math.round(H * 2);
  const g = c.getContext('2d'); g.scale(2, 2);
  const P5 = POSTER_PAL[ch - 1] || POSTER_PAL[0], hz = H * 0.6, R = mulberry(ch * 71);
  withCanvas(g, () => {
    // painted sky in soft bands
    const sky = ctx.createLinearGradient(0, 0, 0, hz);
    P5.forEach((col, i) => sky.addColorStop(i / 4, col));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hz + 2);
    // brushy clouds
    for (let i = 0; i < 26; i++) {
      const y = hz * (0.1 + R() * 0.75), x = R() * W, w = 60 + R() * 160;
      ctx.fillStyle = rgba(P5[Math.min(4, 2 + Math.floor(R() * 3))], 0.12 + R() * 0.14);
      ctx.beginPath(); ctx.ellipse(x, y, w, 4 + R() * 9, (R() - 0.5) * 0.08, 0, TAU); ctx.fill();
    }
    // the sun with retro stripes
    const sx = W * 0.68, sy = hz - 60, sr = 92;
    glow(sx, sy, sr * 3.4, P5[3], 0.6);
    ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.clip();
    const sg = ctx.createLinearGradient(0, sy - sr, 0, sy + sr); sg.addColorStop(0, '#fff3b0'); sg.addColorStop(0.55, P5[4]); sg.addColorStop(1, P5[3]);
    ctx.fillStyle = sg; ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
    ctx.fillStyle = P5[2]; for (let i = 0; i < 6; i++) ctx.fillRect(sx - sr, sy + sr * (0.12 + i * 0.15), sr * 2, 2 + i * 2);
    ctx.restore();
    // distant skyline + the Blue Tower
    for (let layer = 0; layer < 2; layer++) {
      let x = -10; const col = layer ? mix(P5[0], '#000000', 0.2) : mix(P5[1], P5[2], 0.4);
      while (x < W + 10) {
        const w = 16 + R() * 34, h = 30 + R() * (layer ? 120 : 170);
        ctx.fillStyle = col; ctx.fillRect(x, hz - h, w, h);
        ctx.fillStyle = rgba(layer ? '#ffd27a' : '#ff9ad0', layer ? 0.55 : 0.3);
        for (let wy = hz - h + 6; wy < hz - 4; wy += 8) for (let wx = x + 3; wx < x + w - 3; wx += 6) if (R() < 0.2) ctx.fillRect(wx, wy, 2, 3);
        x += w + R() * 4;
      }
      if (layer === 0) {
        const tx = W * 0.3; ctx.fillStyle = mix(P5[0], '#000000', 0.3);
        ctx.beginPath(); ctx.moveTo(tx - 26, hz); ctx.lineTo(tx - 10, hz - 250); ctx.lineTo(tx - 2, hz - 300); ctx.lineTo(tx + 2, hz - 300); ctx.lineTo(tx + 10, hz - 250); ctx.lineTo(tx + 26, hz); ctx.fill();
        glow(tx, hz - 280, 46, '#5a8cff', 0.8); ctx.fillStyle = '#cfe0ff'; starPath(tx, hz - 282, 9, 4); ctx.fill();
      }
    }
    // palms in silhouette
    for (const [px, ph, lean] of [[18, 260, 0.25], [W - 30, 300, -0.3], [W * 0.5, 150, 0.15]]) {
      const base = hz + 20; ctx.strokeStyle = mix(P5[0], '#000000', 0.45); ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, base); ctx.quadraticCurveTo(px + lean * ph * 0.3, base - ph * 0.6, px + lean * ph, base - ph); ctx.stroke();
      ctx.fillStyle = mix(P5[0], '#000000', 0.45);
      const tx = px + lean * ph, ty = base - ph;
      for (let f = 0; f < 9; f++) { const a = -Math.PI / 2 + (f - 4) * 0.42; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + Math.cos(a - 0.9) * 40, ty + Math.sin(a) * 26 - 22, tx + Math.cos(a) * 78, ty + Math.sin(a) * 40 + 24); ctx.quadraticCurveTo(tx + Math.cos(a) * 30, ty + Math.sin(a) * 10, tx, ty); ctx.fill(); }
    }
    // water with sun reflection
    const wg = ctx.createLinearGradient(0, hz, 0, H); wg.addColorStop(0, P5[2]); wg.addColorStop(0.35, P5[1]); wg.addColorStop(1, P5[0]);
    ctx.fillStyle = wg; ctx.fillRect(0, hz, W, H - hz);
    for (let i = 0; i < 30; i++) { const y = hz + 6 + i * i * 0.5, w = 90 - i * 2.2 + R() * 30; if (y > H) break; ctx.fillStyle = rgba(P5[4], 0.5 - i * 0.015); ctx.fillRect(sx - w / 2 + (R() - 0.5) * 20, y, w, 2 + i * 0.12); }
    // vignette
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.5, H * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,2,18,0.65)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  });
  _posterCache = { [key]: c }; _posterCache[key] = c;
  return c;
}
function drawPosterBG(ch, t) {
  ctx.drawImage(posterStatic(ch), 0, 0, W, H);
  // shimmering water and drifting light motes
  for (let i = 0; i < 18; i++) { const x = (hash(i, 7) * W + t * (8 + i)) % W, y = H * 0.62 + hash(i, 8) * H * 0.35; ctx.fillStyle = `rgba(255,240,220,${0.15 + 0.15 * Math.sin(t * 3 + i)})`; ctx.fillRect(x, y, 10 + hash(i, 9) * 18, 1.5); }
}
function drawGrain() {
  const g = grainCanvas();
  ctx.save(); ctx.globalAlpha = 0.6;
  for (let y = 0; y < H; y += 160) for (let x = 0; x < W; x += 160) ctx.drawImage(g, x, y);
  ctx.restore();
}
/* bold diagonal colour slab behind poster titles */
function posterSlab(y, h, cols, skew) {
  const k = skew === undefined ? 26 : skew;
  const g = ctx.createLinearGradient(0, y, W, y + h); g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-10, y + k); ctx.lineTo(W + 10, y); ctx.lineTo(W + 10, y + h - k); ctx.lineTo(-10, y + h); ctx.closePath(); ctx.fill();
}
/* the duo hero pose used on posters */
function drawDuo(cx, gy, h, t, o) {
  o = o || {};
  drawJunoFront(cx - h * 0.08, gy, h, { t, wave: o.wave, grin: o.grin });
  drawMiloFront(cx + h * 0.33, gy + 2, h * 0.36, { t, expr: o.expr || 'happy', wave: o.wave, pack: 'cyan', reflect: true });
}
/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  try {
    inputTick();
    if (fadeDir === 1) { fadeA += dt * 5; if (fadeA >= 1) { fadeA = 1; fadeDir = -1; if (nextScene) { scene = nextScene; nextScene = null; ptr = null; } } }
    else if (fadeDir === -1) { fadeA -= dt * 4; if (fadeA <= 0) { fadeA = 0; fadeDir = 0; } }
    if (scene && scene.update) scene.update(dt);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05040c'; ctx.fillRect(0, 0, W, H);
    if (scene && scene.draw) scene.draw();
    if (fadeA > 0) { ctx.fillStyle = `rgba(3,3,10,${fadeA})`; ctx.fillRect(0, 0, W, H); }
  } catch (e) {
    window.__lastError = e; console.error(e);
  }
  requestAnimationFrame(frame);
}
function boot() {
  resize();
  scene = new TitleScene();
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (AC) AC.suspend(); if (scene && scene instanceof RunScene && scene.state === 'play') scene.pause = true; } else if (AC) AC.resume(); });
}
boot();

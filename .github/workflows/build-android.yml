name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Finds the Milo project whether you uploaded the files, a folder, or the zip itself
      - name: Locate project
        run: |
          ls -la
          if [ -f settings.gradle ] && [ -f app/build.gradle ]; then P=.
          else
            Z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$Z" ]; then unzip -q "$Z" -d work; fi
            F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
            if [ -z "$F" ]; then
              echo "settings.gradle not found. Upload the files from the Milo zip to the top of the repository."
              find . -maxdepth 3 -not -path './.git/*' | head -50
              exit 1
            fi
            P=$(dirname "$F")
          fi
          echo "PROJECT=$P" >> $GITHUB_ENV
          echo "Using project at $P"; ls -la "$P"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p build-out
          cp app/build/outputs/apk/debug/app-debug.apk build-out/Milo-The-Last-Message.apk
          ls -l build-out

      - uses: actions/upload-artifact@v5
        with:
          name: milo-debug-apk
          path: ${{ env.PROJECT }}/build-out/Milo-The-Last-Message.apk

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build "${{ env.PROJECT }}/build-out/Milo-The-Last-Message.apk" \
            --title "Milo debug build" \
            --notes "Debug APK built from ${{ github.sha }}" \
            --prerelease
